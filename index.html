<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2.1.6 - Định dạng hỗn hợp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            padding: 30px;
        }
        .box-mixed {
            max-width: 650px;
            margin: 0 auto;
            background-color: #fffbeb;
            color: #1e293b;
            padding: 24px 28px;
            border-top: 5px solid #d97706;
            border-right: 2px dashed #f59e0b;
            border-bottom: 3px solid #b45309;
            border-left: 8px solid #f59e0b;
            border-radius: 10px;
        }
        .box-mixed h1 {
            color: #b45309;
            font-size: 24px;
            margin-bottom: 12px;
        }
        .box-mixed p {
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .highlight {
            background-color: #fde68a;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="box-mixed">
        <h1>Định Dạng Hỗn Hợp Với CSS</h1>
        <p>Đoạn văn này minh họa việc phối hợp <span class="highlight">màu sắc, khung viền (border)</span> cùng khoảng cách bên trong (<span class="highlight">padding</span>) và bên ngoài (<span class="highlight">margin</span>).</p>
        <p>Mỗi cạnh của thuộc tính <code>border</code> được thiết lập độ dày, kiểu nét và màu sắc khác nhau để tạo điểm nhấn trực quan.</p>
    </div>
</body>
</html>
